# Это учебная схема-контракт для обсуждения и review, а не исполняемый формат конкретного преобразователя.
version: 1
purpose: "synthetic service workflow testing"
defaultAction: deny

boundaries:
  source: "protected-staging-only"
  mapping: "separate-protected-storage"
  safeTarget: "isolated-test"

rules:
  - id: party-name-01
    target: "Catalog.Контрагенты.Description"
    class: direct-identifier
    action: pseudonymize
    strategy: stable-sequence
    outputPattern: "Контрагент-{0000}"
    preserveEquality: true
    mappingStorage: outside-safe-contour
    negativeCheck: no-source-values
    utilityCheck: references-remain-resolvable
    owner: data-owner

  - id: contact-phone-01
    target: "*.Телефон"
    class: contact
    action: synthesize
    strategy: approved-test-range
    preserveEquality: false
    negativeCheck: only-approved-pattern
    utilityCheck: format-validation-passes
    owner: data-owner

  - id: free-text-01
    target: "*.Комментарий"
    class: free-text
    action: synthesize
    strategy: allowlisted-phrases
    preserveEquality: false
    negativeCheck: no-source-text-canaries
    utilityCheck: boundary-scenarios-covered
    owner: test-owner

  - id: production-secret-01
    target: "settings.credentials.*"
    class: secret
    action: drop
    preserveEquality: false
    negativeCheck: no-secret-like-values
    utilityCheck: test-credentials-installed-separately
    owner: security-owner

  - id: production-endpoint-01
    target: "settings.endpoints.*"
    class: external-connection
    action: replace
    strategy: test-stub-allowlist
    preserveEquality: false
    negativeCheck: no-production-hosts
    utilityCheck: stub-healthcheck-passes
    owner: integration-owner

forbiddenOutputs:
  - source-dump
  - mapping-table
  - production-credentials
  - source-value-list
  - raw-application-logs

acceptance:
  requireNegativeChecks: true
  requireIntegrityChecks: true
  requireUtilityChecks: true
  requireIndependentReview: true
